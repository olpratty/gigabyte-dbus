<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.gigabyte.daemon"/>
    <allow send_destination="com.gigabyte.daemon"/>
  </policy>

  <policy user="cc-plugin-user">
    <allow send_destination="com.gigabyte.daemon"
           send_path="/com/gigabyte/Platform"
           send_interface="com.gigabyte.Platform"
           send_member="SetFanMode"/>
    <allow send_destination="com.gigabyte.daemon"
           send_path="/com/gigabyte/Platform"
           send_interface="com.gigabyte.Platform"
           send_member="SetFanSpeed"/>
  </policy>
</busconfig>
